[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
moino_text = { path = "crates/moino_text" }
moino_markdown = { path = "crates/moino_markdown" }
moino_document = { path = "crates/moino_document" }
moino_editing = { path = "crates/moino_editing" }
ropey = { version = "=2.0.0-beta.1", features = ["metric_chars", "metric_utf16"] }
unicode-segmentation = "=1.13.3"
proptest = "=1.12.0"
caseless = "=0.2.2"
finl_unicode = "=1.5.0"
comrak = { version = "=0.59.0", default-features = false }
moino_jobs = { path = "crates/moino_jobs" }
moino_testkit = { path = "crates/moino_testkit" }
moino_platform = { path = "crates/moino_platform" }
moino_editor = { path = "crates/moino_editor" }
moino_theme = { path = "crates/moino_theme" }
moino_ui = { path = "crates/moino_ui" }
moino_workspace = { path = "crates/moino_workspace" }
moino_math = { path = "crates/moino_math" }
moino_diagram = { path = "crates/moino_diagram" }
moino_preview = { path = "crates/moino_preview" }
moino_export = { path = "crates/moino_export" }
anyhow = "=1.0.104"
thiserror = "=2.0.21"
saphyr = { version = "=0.3.3", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"
pulldown-cmark = "=0.13.5"
tracing = "=0.1.44"
rust-i18n = "=4.2.4"
sys-locale = "=0.3.2"
gpui-kit = { version = "=0.8.1", default-features = false, features = ["component", "syntect"] }
interprocess = "=2.4.7"
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-svg = { version = "=0.1.15", features = ["standalone", "embed-fonts"] }
merman = { version = "=0.9.2", default-features = false, features = ["all-diagrams", "complete-svg"] }
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["scan-fonts"] }
hayro = "=0.8.0"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

[profile.dev]
debug = "limited"

[profile.release]
strip = "symbols"

# Temporary host text-foreground seam; removal is tracked in Moino #17.
[patch.crates-io]
gpui-base = { git = "https://github.com/wangdiandao/gpui-kit", rev = "d6f69648d0d8150a1125fd3e3efd49e1878cc3ee" }
